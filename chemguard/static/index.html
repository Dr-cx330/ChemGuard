<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ChemGuard Chat</title>
<style>body{font:16px system-ui,sans-serif;background:#f4f6f8;color:#17202a;max-width:760px;margin:40px auto;padding:0 16px}h1{font-size:28px}.note{background:#fff4d6;padding:12px;border-radius:8px}#chat{background:white;border-radius:10px;padding:16px;min-height:250px;margin:16px 0}.msg{padding:12px;margin:8px 0;border-radius:8px;background:#f1f4f7;white-space:pre-wrap}.user{background:#e6f1ff}.result{border-left:4px solid #777;padding-left:12px}textarea{width:100%;box-sizing:border-box;padding:12px;font:inherit}button{padding:10px 18px;margin-top:8px;cursor:pointer}</style>
<h1>ChemGuard 对话演示</h1><p class="note">操作提议会先交给安全规则引擎评估。此演示只返回判断，不连接或控制真实设备。</p><div id="chat"></div><textarea id="message" rows="3" placeholder="描述你希望评估的实验操作"></textarea><button id="send">发送并评估</button>
<script>const box=document.querySelector('#chat'),input=document.querySelector('#message');function add(text,cls='msg'){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;box.append(d)}document.querySelector('#send').onclick=async()=>{const message=input.value.trim();if(!message)return;add(message,'user');input.value='';try{const r=await fetch('/api/v1/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message})});const data=await r.json();if(!r.ok)throw Error(data.detail||'请求失败');add(data.reply);if(data.evaluation)add('ChemGuard 判定：'+data.evaluation.decision+'\n原因：'+data.evaluation.reasons.join('；')+'\n模拟模式：'+data.evaluation.simulation_only,'result')}catch(e){add('错误：'+e.message)}};input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.querySelector('#send').click()}});</script>
</html>
